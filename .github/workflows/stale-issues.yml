name: Close inactive issues

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview only; live runs also require STALE_ISSUES_ENABLED=true
        type: boolean
        default: true

permissions:
  issues: write

concurrency:
  group: stale-issues
  cancel-in-progress: false

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_INACTIVITY_DRY_RUN: ${{ vars.STALE_ISSUES_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        with:
          script: |
            const repo = context.repo;
            const dryRun = process.env.ISSUE_INACTIVITY_DRY_RUN !== 'false';
            const cutoff = Date.now() - 30 * 24 * 60 * 60 * 1000;
            const isInactive = issue => {
              const labels = new Set(issue.labels.map(label => label.name));
              return !issue.pull_request && issue.state === 'open' &&
                labels.has('needs-info') && !labels.has('planned') && !labels.has('in-progress') &&
                Date.parse(issue.updated_at) <= cutoff;
            };
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...repo, state: 'open', labels: 'needs-info', per_page: 100,
            });
            let closed = 0;
            for (const candidate of issues) {
              if (!isInactive(candidate)) continue;
              // A reply or status change may have arrived since the list request.
              const { data: issue } = await github.rest.issues.get({
                ...repo, issue_number: candidate.number,
              });
              if (!isInactive(issue)) continue;
              if (dryRun) {
                core.info(`Would close #${issue.number}: no activity since ${issue.updated_at}.`);
                continue;
              }
              await github.rest.issues.update({
                ...repo, issue_number: issue.number, state: 'closed', state_reason: 'not_planned',
              });
              await github.rest.issues.createComment({
                ...repo, issue_number: issue.number,
                body: [
                  'Closing because this issue is marked `needs-info` and has had no activity for 30 days.',
                  'This does not mean the problem has been fixed. You can still provide more information and ask a maintainer to reopen it.',
                  '',
                  '此议题标记为 `needs-info`，且已连续 30 天无活动，因此暂时关闭。',
                  '关闭不表示问题已经修复；你仍可补充信息，并请维护者重新打开。',
                ].join('\n'),
              });
              closed += 1;
            }
            core.info(`${dryRun ? 'Preview' : 'Live'} scan complete; closed ${closed} issue(s).`);

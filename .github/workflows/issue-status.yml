name: Issue status

on:
  push:
    branches: [main]
    paths: ['.github/workflows/issue-status.yml']
  issues:
    types: [opened, reopened, labeled, unlabeled]
  workflow_dispatch:

permissions:
  issues: write

concurrency:
  group: issue-status-${{ github.event.issue.number || 'all' }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const repo = context.repo;
            const definitions = [
              ['needs-info', 'fbca04', '等待提问者补充信息 / Awaiting information requested by a maintainer'],
              ['planned', '0052cc', '已列入计划 / Accepted and planned, not yet in progress'],
              ['in-progress', '1d76db', '正在修改 / Implementation or fix in progress'],
            ];
            const statuses = definitions.map(([name]) => name);
            const statusName = name => name?.replace(/^status: (planned|in-progress)$/, '$1');
            const existing = await github.paginate(github.rest.issues.listLabelsForRepo, {
              ...repo, per_page: 100,
            });

            // Preserve assignments when removing the old status prefixes.
            for (const name of ['planned', 'in-progress']) {
              const legacy = `status: ${name}`;
              const oldLabel = existing.find(label => label.name === legacy);
              if (!oldLabel) continue;
              if (existing.some(label => label.name === name)) {
                // Also support a partially completed migration.
                const issues = await github.paginate(github.rest.issues.listForRepo, {
                  ...repo, state: 'all', labels: legacy, per_page: 100,
                });
                for (const issue of issues) {
                  await github.rest.issues.addLabels({ ...repo, issue_number: issue.number, labels: [name] });
                  await github.rest.issues.removeLabel({ ...repo, issue_number: issue.number, name: legacy });
                }
                await github.rest.issues.deleteLabel({ ...repo, name: legacy });
              } else {
                await github.rest.issues.updateLabel({ ...repo, name: legacy, new_name: name });
                oldLabel.name = name;
              }
            }

            for (const [name, color, description] of definitions) {
              if (existing.some(label => label.name === name)) continue;
              try {
                await github.rest.issues.createLabel({ ...repo, name, color, description });
              } catch (error) {
                // Another issue's run may have created the same label concurrently.
                if (error.status !== 422 || !error.response?.data?.errors?.some(
                  detail => detail.code === 'already_exists'
                )) throw error;
              }
            }

            // The three statuses above replace the discussion/stale label layers.
            if (context.ref === 'refs/heads/main') {
              for (const name of ['status: needs-triage', 'status: discussion', 'stale', 'no-stale']) {
                if (!existing.some(label => label.name === name)) continue;
                try {
                  await github.rest.issues.deleteLabel({ ...repo, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
            }

            async function syncIssue(issue_number) {
              // Read current labels rather than an older webhook snapshot.
              const { data: issue } = await github.rest.issues.get({ ...repo, issue_number });
              if (issue.pull_request || issue.state !== 'open') return;
              const names = new Set(issue.labels.map(label => label.name));
              const active = statuses.filter(name => names.has(name));
              let selected = active[0];
              if (active.length > 1) {
                // The newest applied status wins, even if webhook runs arrive out of order.
                const events = await github.paginate(github.rest.issues.listEvents, {
                  ...repo, issue_number, per_page: 100,
                });
                const latest = events.filter(event =>
                  event.event === 'labeled' && active.includes(statusName(event.label?.name))
                ).sort((a, b) => b.id - a.id)[0];
                if (!latest) {
                  core.warning(`Cannot resolve multiple statuses on #${issue_number}; leaving labels unchanged.`);
                  return;
                }
                selected = statusName(latest.label.name);
              }
              const remove = new Set(active.filter(name => name !== selected));
              for (const name of remove) {
                if (!names.has(name)) continue;
                try {
                  await github.rest.issues.removeLabel({ ...repo, issue_number, name });
                } catch (error) {
                  if (error.status !== 404) throw error;
                }
              }
              core.info(`#${issue_number}: ${selected || 'untriaged (no status label)'}`);
            }

            if (context.eventName === 'workflow_dispatch' || context.eventName === 'push') {
              const issues = await github.paginate(github.rest.issues.listForRepo, {
                ...repo, state: 'open', per_page: 100,
              });
              for (const issue of issues) {
                if (!issue.pull_request) await syncIssue(issue.number);
              }
            } else {
              await syncIssue(context.issue.number);
            }
